<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manage event — edit a session · mockup</title>
<style>
  :root{--blue:#2E78F5;--indigo:#5B4BE0;--indigo-soft:#EDEBFB;--navy:#0c2340;--muted:#64748b;--line:#e5e9f0;--ink:#1e293b;--red:#c0392b;}
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f6fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px;}
  .wrap{max-width:820px;margin:0 auto;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;}
  h2{font-size:16px;font-weight:700;margin:0 0 3px;color:var(--navy);}
  .hint{font-size:12px;color:var(--muted);margin:0 0 14px;}
  svg{stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 8px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;}
  .grip{color:#b6c0ce;cursor:grab;padding:4px 2px;}
  .tico{width:30px;height:30px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
  .body{flex:1;min-width:0;}
  .row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--indigo-soft);color:var(--indigo);}
  .title{font-size:14px;font-weight:600;color:var(--navy);}
  .sub{font-size:12px;color:var(--muted);}
  .meta{display:flex;align-items:center;gap:14px;margin-top:7px;font-size:12px;flex-wrap:wrap;}
  .live{display:inline-flex;align-items:center;gap:5px;color:var(--red);font-weight:700;}
  .live .dt{width:7px;height:7px;border-radius:50%;background:var(--red);}
  .lnk{color:var(--blue);font-weight:600;cursor:pointer;}
  .lnk.r{color:var(--red);}
  .up{margin-top:8px;font-size:12px;color:var(--blue);font-weight:600;cursor:pointer;}
  .up span{color:var(--muted);font-weight:400;}
  .acts{display:flex;gap:12px;align-self:flex-start;}
  .acts .edit{color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;}
  .acts .remove{color:var(--red);font-size:12px;font-weight:600;cursor:pointer;}
  /* edit mode */
  .card.editing{background:#f8faff;border-color:#bcd3fb;box-shadow:0 0 0 2px rgba(46,120,245,.18);flex-direction:column;padding:14px;}
  .ehead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:1fr 190px;gap:10px;}
  .fld label{display:block;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:4px;}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;background:#fff;}
  .fld{margin-bottom:10px;}
  .eact{display:flex;justify-content:flex-end;gap:8px;margin-top:2px;}
  .btn{font-family:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);}
  .btn.p{background:var(--blue);color:#fff;border-color:var(--blue);}
  .tag{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>Sessions</h2>
    <p class="hint">Drag to reorder · click <b>Edit</b> to change a session’s title, type, track, or description in place.</p>
    <div id="list"></div>
  </div>
  <p class="tag">Mockup · click Edit on any session to try the inline editor.</p>
</div>

<script>
  const IC = {
    grip:'<svg width="16" height="16" viewBox="0 0 20 20"><circle cx="7" cy="4" r="1.1"/><circle cx="7" cy="10" r="1.1"/><circle cx="7" cy="16" r="1.1"/><circle cx="13" cy="4" r="1.1"/><circle cx="13" cy="10" r="1.1"/><circle cx="13" cy="16" r="1.1"/></svg>',
    keynote:'<svg width="17" height="17" viewBox="0 0 20 20"><rect x="8" y="2" width="4" height="8" rx="2"/><path d="M6 9a4 4 0 0 0 8 0M10 13v4M7 17h6"/></svg>',
    workshop:'<svg width="17" height="17" viewBox="0 0 20 20"><path d="M14.7 6.3a3 3 0 0 1-3.9 3.9l-5 5a1.5 1.5 0 0 1-2.1-2.1l5-5a3 3 0 0 1 3.9-3.9l-1.8 1.8 1.2 1.2 1.8-1.8z"/></svg>',
    showcase:'<svg width="17" height="17" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="9" rx="1.5"/><path d="M10 13v3M7 17h6"/></svg>',
    talkshow:'<svg width="17" height="17" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.2"/><path d="M6 6a5.5 5.5 0 0 0 0 8M14 6a5.5 5.5 0 0 1 0 8"/></svg>',
  };
  const TYPES = [["keynote","Keynote","keynote"],["panel","Panel","talkshow"],["talk_show","Talk Show","talkshow"],["founder_showcase","Founder Showcase","showcase"],["workshop","Workshop","workshop"]];
  const TRACKS = ["","HealthTech","SaaS / B2B Software","EdTech","AI / ML","FinTech"];
  const SESSIONS = [
    {t:"Auditorium", type:"keynote", track:"", abstract:""},
    {t:"Exhibitors", type:"workshop", track:"", abstract:""},
    {t:"Community", type:"workshop", track:"", abstract:""},
    {t:"VIP Room", type:"founder_showcase", track:"HealthTech", abstract:"Featured founder spotlight for HealthTech investors."},
    {t:"Inside the Investor’s Mind 2", type:"talk_show", track:"", abstract:""},
  ];
  const typeInfo = v => TYPES.find(x=>x[0]===v) || TYPES[0];
  const list = document.getElementById("list");

  function render() {
    list.innerHTML = "";
    SESSIONS.forEach((s, i) => {
      const el = document.createElement("div");
      if (s.editing) {
        el.className = "card editing";
        el.innerHTML =
          '<div class="ehead">'+IC[typeInfo(s.type)[2]]+' Editing session</div>'+
          '<div class="grid">'+
            '<div class="fld"><label>Session title</label><input id="t'+i+'" value="'+s.t.replace(/"/g,'&quot;')+'" /></div>'+
            '<div class="fld"><label>Type</label><select id="ty'+i+'">'+TYPES.map(x=>'<option value="'+x[0]+'"'+(x[0]===s.type?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'+
          '</div>'+
          '<div class="fld"><label>Sector track (optional)</label><select id="tr'+i+'">'+TRACKS.map(x=>'<option'+(x===s.track?' selected':'')+'>'+(x||'No specific track')+'</option>').join('')+'</select></div>'+
          '<div class="fld"><label>Description (optional)</label><textarea id="ab'+i+'" rows="2" placeholder="Short abstract shown on the agenda…">'+(s.abstract||'')+'</textarea></div>'+
          '<div class="eact"><button class="btn" data-cancel="'+i+'">Cancel</button><button class="btn p" data-save="'+i+'">Save changes</button></div>';
      } else {
        const ti = typeInfo(s.type);
        el.className = "card";
        el.innerHTML =
          '<span class="grip">'+IC.grip+'</span>'+
          '<span class="tico">'+IC[ti[2]]+'</span>'+
          '<div class="body">'+
            '<div class="row1"><span class="badge">'+ti[1]+'</span><span class="title">'+s.t+'</span>'+(s.track?'<span class="sub">'+s.track+'</span>':'')+'</div>'+
            '<div class="meta"><span class="live"><span class="dt"></span>Live</span><span class="lnk">Open live link</span><span class="lnk r">End session</span></div>'+
            '<div class="up">Upload recording <span>MP4 / WebM / MOV, up to 500 MB</span></div>'+
          '</div>'+
          '<div class="acts"><span class="edit" data-edit="'+i+'">Edit</span><span class="remove">Remove</span></div>';
      }
      list.appendChild(el);
    });
  }
  render();

  list.addEventListener("click", e => {
    const ed = e.target.closest("[data-edit]"); if (ed) { SESSIONS[+ed.dataset.edit].editing = true; render(); return; }
    const cx = e.target.closest("[data-cancel]"); if (cx) { SESSIONS[+cx.dataset.cancel].editing = false; render(); return; }
    const sv = e.target.closest("[data-save]"); if (sv) {
      const i = +sv.dataset.save;
      SESSIONS[i].t = document.getElementById("t"+i).value || SESSIONS[i].t;
      SESSIONS[i].type = document.getElementById("ty"+i).value;
      const tr = document.getElementById("tr"+i).value; SESSIONS[i].track = tr==="No specific track" ? "" : tr;
      SESSIONS[i].abstract = document.getElementById("ab"+i).value;
      SESSIONS[i].editing = false; render();
    }
  });
</script>
</body>
</html>
