name: Link crawl (runtime)

# Manual, opt-in runtime crawl: loads every static route in a real signed-in
# browser and reports 404/500s, sign-in bounces (guard/role bugs), console
# errors, and dead in-page links. Kept out of the per-PR CI because it needs a
# running deploy + an authenticated session; run it against a preview/staging URL.
#
# Requires two repo secrets:
#   CRAWL_BASE_URL       e.g. https://staging.icapos.com
#   CRAWL_STORAGE_STATE  contents of a Playwright storageState JSON for a
#                        signed-in staff/founder session (base64 or raw JSON)
# and optionally a CRAWL_SAMPLE_ID variable for [id] routes.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to crawl (overrides CRAWL_BASE_URL secret)"
        required: false
      sample_id:
        description: "A real id to substitute into [param] routes"
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Secrets can't be referenced in a step-level `if:`, so surface the ones we
    # branch on as job-level env vars and gate the steps on those instead.
    env:
      CRAWL_STORAGE_STATE: ${{ secrets.CRAWL_STORAGE_STATE }}
      # Resolve the effective base URL once (manual input wins over the secret).
      # Empty when neither is configured — the crawl then skips instead of
      # failing against a non-existent localhost server.
      CRAWL_BASE_URL: ${{ github.event.inputs.base_url || secrets.CRAWL_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip notice (no base URL configured)
        if: ${{ env.CRAWL_BASE_URL == '' }}
        run: echo "No CRAWL_BASE_URL secret and no base_url input — nothing to crawl. Skipping gracefully."

      - name: Install Playwright + Chromium
        if: ${{ env.CRAWL_BASE_URL != '' }}
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Write auth storage state
        if: ${{ env.CRAWL_BASE_URL != '' && env.CRAWL_STORAGE_STATE != '' }}
        run: printf '%s' "$CRAWL_STORAGE_STATE" > auth-state.json

      - name: Crawl
        if: ${{ env.CRAWL_BASE_URL != '' }}
        run: npm run audit:crawl
        env:
          BASE_URL: ${{ env.CRAWL_BASE_URL }}
          STORAGE_STATE: auth-state.json
          SAMPLE_ID: ${{ github.event.inputs.sample_id || vars.CRAWL_SAMPLE_ID }}
